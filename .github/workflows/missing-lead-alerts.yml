name: Missing Lead Alerts

# Manual trigger only. The hourly schedule lives on cron-job.org (job
# "Mira Mar missing-lead alerts + auto-push (hourly)", 5 * * * * America/New_York),
# because GitHub's scheduler delayed and dropped runs (5 runs in 24h observed
# 2026-10-15). Do not re-add a schedule here: two schedulers can run at once.
#
# This repo is PUBLIC and so are its Actions logs. The route's response
# contains lead names and emails, so only counts are printed below.
on:
  workflow_dispatch:

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger alert check
        env:
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          test -n "$DASHBOARD_URL" || { echo "DASHBOARD_URL secret missing"; exit 1; }
          test -n "$CRON_SECRET"   || { echo "CRON_SECRET secret missing"; exit 1; }
          http_code=$(curl -sS -o response.json -w '%{http_code}' --max-time 120 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$DASHBOARD_URL/api/cron/missing-lead-alerts")
          jq '{ok, autoPush, scanned, missingInWindow, inGrace, heldByCap,
               pushed: (.pushed // [] | length), newAlerts: (.newAlerts // [] | length),
               resolved: (.resolved // [] | length), emailed: (.emailed != null), error}' response.json || true
          test "$http_code" = "200" || { echo "Route returned $http_code"; exit 1; }
